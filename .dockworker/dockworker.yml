dockworker:
  version: '6'
  application:
    name: Provides a single entrypoint for various digital 'exhibits' at UNB Libraries.
    uri: https://exhibits.lib.unb.ca
    description: >
      Provides a single entrypoint for various digital 'exhibits' at UNB Libraries.
    topics:
      - exhibits
      - omeka
    identifiers:
      id: exhibits.lib.unb.ca
      slug: exhibits-lib-unb-ca
      short_slug: exhibits
      uuid: 3103
    framework:
      name: Omeka
      version: 3
      startup_finished_marker: '99_zz_notify_user_URI'
      endpoint:
        name: http
        port: 80
        readiness_timeout: 15
    license:
      license: MIT
      holder: University of New Brunswick Libraries
    shell:
      path: /bin/sh
  endpoints:
    env:
      - dev
      - prod
    deployments:
      exhibits-lib-unb-ca:
        default: true
        managed: true
        name: exhibits-lib-unb-ca
      omeka-mysql-lib-unb-ca:
        managed: false
        name: mysql
  workflows:
    vcs:
      type: github
      owner: unb-libraries
      name: exhibits.lib.unb.ca
    jira:
      project_keys:
        - EXHIBITS
    image:
      name: ghcr.io/unb-libraries/exhibits.lib.unb.ca
      parent: ghcr.io/unb-libraries/nginx-php:1.x-7.x
      repository: GitHub
      push-branches:
        - dev
        - prod
